name: Validate private captured build
run-name: Capture ${{ inputs.capture_id }}
on:
  workflow_dispatch:
    inputs:
      capture_id:
        description: Immutable capture UUID (normally supplied by the owner console)
        type: string
        required: true
      capture:
        description: Capture metadata and hashes only; never paste unpublished content
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: captured-build-${{ inputs.capture_id }}
  cancel-in-progress: false
jobs:
  checks:
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    with:
      concurrency_key: capture-${{ inputs.capture_id }}
  build:
    needs: checks
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --global corepack@0.36.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: node scripts/fetch-captured-input.ts
        env:
          PUBLISH_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLISH_R2_BUCKET: mohamedeghboudj-media-preview
          PUBLISH_R2_ACCESS_KEY_ID: ${{ secrets.PUBLISH_R2_ACCESS_KEY_ID }}
          PUBLISH_R2_SECRET_ACCESS_KEY: ${{ secrets.PUBLISH_R2_SECRET_ACCESS_KEY }}
      # Read credentials are scoped to retrieval. Compiler children receive
      # only the explicit OS/toolchain allowlist and local build paths.
      - run: node scripts/build-captured-input.ts
      - run: node scripts/prepare-private-preview.ts
        if: ${{ fromJSON(inputs.capture).purpose == 'preview' }}
      # Automatic activation remains disabled until durable deployment intent
      # and ambiguous-response reconciliation are connected. Version comparison
      # alone is not a deployment lock, and GitHub concurrency is not FIFO.
      # No private input, logs, TeX, originals, PDFs or pages become Actions artifacts.
      - if: ${{ always() }}
        run: node scripts/cleanup-captured-build.ts
