name: Sprint 0 full TeX Live proof
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cv-spike.yml'
      - 'packages/cv-engine/**'
      - 'packages/schema/**'
      - 'database/**'
      - 'scripts/**'
      - 'pnpm-lock.yaml'
permissions:
  contents: read
concurrency:
  group: cv-spike
  cancel-in-progress: false
jobs:
  compile:
    # PR runs compile only committed synthetic fixtures and receive no secrets.
    if: github.event_name == 'pull_request' || github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --global corepack@0.36.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm db:local
      - run: pnpm spike:local
      - run: pnpm cv:prepare
      - run: pnpm cv:compile
      # Synthetic spike payloads only. Never reuse this public artifact step for
      # an owner's private company/role variants or unpublished content.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-trilingual-cv-proof
          path: |
            artifacts/cv/*/cv.pdf
            artifacts/cv/measurements.json
          retention-days: 3
